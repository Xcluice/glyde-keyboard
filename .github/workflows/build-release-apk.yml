name: Build release APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.LUMEN_KS_B64 }}
        run: |
          mkdir -p keystore
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > keystore/lumen-release.jks
          else
            keytool -genkeypair -keystore keystore/lumen-release.jks -alias lumen -keyalg RSA -keysize 2048 -validity 10000 -storepass lumenrelease -keypass lumenrelease -dname "CN=Lumen Keyboard"
          fi

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lumen-release
          path: app/build/outputs/apk/release/*.apk

      - name: Archive reports for failed job
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: '*/build/reports'
        if: ${{ failure() }}
